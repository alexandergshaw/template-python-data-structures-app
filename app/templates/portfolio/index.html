{% extends "base.html" %}

{% block title %}Portfolio Home{% endblock %}

{% block content %}
  <section>
    <h2>Featured Work</h2>
    <ul>
      {% for item in portfolios %}
        <li>
          <h3>{{ item.title }}</h3>
          <p><strong>{{ item.student_name }}</strong></p>
          <p>{{ item.summary }}</p>
          <a href="{{ url_for('portfolio.portfolio_detail', slug=item.slug) }}">View project</a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
